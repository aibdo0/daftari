<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0c0b09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>دفتري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0c0b09;--bg2:#151310;--bg3:#1c1a16;
  --surface:#242118;--surface2:#2c2920;--surface3:#343028;
  --accent:#c8a84b;--accent-dim:rgba(200,168,75,0.12);--accent-glow:rgba(200,168,75,0.25);
  --text:#ede8d8;--text2:#9a9282;--text3:#5c5648;--text4:#3a3630;
  --danger:#b33a2e;--success:#2d8f5e;
  --r:14px;--rs:9px;--rxs:6px;
  --shadow:0 4px 24px rgba(0,0,0,0.5);
  --font-ar:'Cairo',sans-serif;--font-serif:'Amiri',serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ar);overflow:hidden;-webkit-font-smoothing:antialiased}
 
/* ======= NOISE TEXTURE ======= */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.4;
}
 
/* ======= LOCK SCREEN ======= */
#lockScreen{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:radial-gradient(ellipse at 50% 30%, #1e1a0f 0%, var(--bg) 70%);
}
.lock-ornament{
  width:60px;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  margin-bottom:20px;
}
.lock-icon-wrap{
  width:72px;height:72px;border-radius:50%;
  border:1px solid rgba(200,168,75,0.3);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:var(--accent);margin-bottom:16px;
  background:var(--accent-dim);
  box-shadow:0 0 30px var(--accent-glow);
}
.lock-title{
  font-family:var(--font-serif);font-size:36px;
  color:var(--accent);letter-spacing:3px;margin-bottom:4px;
}
.lock-sub{font-size:12px;color:var(--text3);letter-spacing:2px;margin-bottom:28px}
.pin-dots{display:flex;gap:14px;margin-bottom:28px}
.pin-dot{
  width:12px;height:12px;border-radius:50%;
  border:1.5px solid var(--text3);background:transparent;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
}
.pin-dot.filled{
  background:var(--accent);border-color:var(--accent);
  transform:scale(1.2);box-shadow:0 0 8px var(--accent-glow);
}
.pin-pad{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:10px;width:240px;
}
.pin-key{
  height:68px;border-radius:50%;
  border:1px solid var(--surface3);background:var(--surface);
  color:var(--text);font-size:22px;font-family:var(--font-ar);font-weight:500;
  cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.pin-key::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:var(--accent);opacity:0;transition:opacity .15s;
}
.pin-key:active::after{opacity:.2}
.pin-key:hover{border-color:var(--accent);background:var(--surface2)}
.pin-key .sub{font-size:8px;color:var(--text3);letter-spacing:2px;margin-top:1px}
.pin-key.ok-key{border-color:rgba(200,168,75,0.4);background:var(--accent-dim);color:var(--accent)}
.pin-key.del-key{color:var(--text2)}
.pin-err{
  font-size:12px;color:var(--danger);min-height:18px;
  text-align:center;margin-top:12px;letter-spacing:.5px;
}
.lock-hint{font-size:11px;color:var(--text4);margin-top:16px;cursor:pointer;letter-spacing:.5px}
.lock-hint:hover{color:var(--text3)}
.lock-ornament-bottom{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--text4),transparent);
  margin-top:20px;
}
 
/* ======= LOADING ======= */
#loadingScreen{
  position:fixed;inset:0;z-index:998;
  display:none;align-items:center;justify-content:center;
  background:var(--bg);
}
.loader{
  width:32px;height:32px;border-radius:50%;
  border:2px solid var(--surface3);
  border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
 
/* ======= APP ======= */
#app{display:none;height:100vh;flex-direction:column}
#app.show{display:flex}
 
/* TOP BAR */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 16px;height:52px;
  background:var(--bg2);
  border-bottom:1px solid var(--surface2);
  flex-shrink:0;position:relative;z-index:10;
}
.topbar-logo{
  font-family:var(--font-serif);font-size:20px;
  color:var(--accent);flex:1;letter-spacing:1px;
}
.topbar-sync{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--text4)}
.sync-dot.online{background:var(--success);box-shadow:0 0 6px var(--success)}
.sync-dot.saving{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.iBtn{
  width:34px;height:34px;border-radius:var(--rxs);
  border:1px solid var(--surface3);background:none;
  color:var(--text2);font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;flex-shrink:0;
}
.iBtn:hover{background:var(--surface);color:var(--text);border-color:var(--surface3)}
.iBtn.gold{color:var(--accent);border-color:rgba(200,168,75,0.3);background:var(--accent-dim)}
 
/* BODY */
.body{flex:1;display:flex;overflow:hidden}
 
/* SIDEBAR */
.sidebar{
  width:265px;flex-shrink:0;
  background:var(--bg2);
  border-left:1px solid var(--surface2);
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.s-search{padding:12px;border-bottom:1px solid var(--surface2)}
.s-search input{
  width:100%;padding:8px 12px;
  background:var(--surface);border:1px solid var(--surface3);
  border-radius:var(--rs);color:var(--text);
  font-size:13px;font-family:var(--font-ar);
  transition:border-color .15s;
}
.s-search input:focus{outline:none;border-color:rgba(200,168,75,0.4)}
.s-search input::placeholder{color:var(--text3)}
.s-cats{
  padding:10px 12px;display:flex;gap:6px;flex-wrap:wrap;
  border-bottom:1px solid var(--surface2);
}
.cat-chip{
  padding:3px 10px;border-radius:20px;font-size:11px;
  cursor:pointer;border:1px solid transparent;
  color:var(--text3);background:var(--surface);
  transition:all .15s;
}
.cat-chip:hover{color:var(--text2)}
.cat-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.s-list{flex:1;overflow-y:auto;padding:8px}
.s-list::-webkit-scrollbar{width:3px}
.s-list::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.ncard{
  padding:11px 12px;border-radius:var(--rs);
  cursor:pointer;margin-bottom:5px;
  border:1px solid transparent;transition:all .15s;
}
.ncard:hover{background:var(--surface);border-color:var(--surface3)}
.ncard.on{background:var(--surface);border-color:rgba(200,168,75,0.35)}
.ncard-title{
  font-size:13px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:5px;
}
.ncard-preview{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard-meta{font-size:10px;color:var(--text3);margin-top:4px;display:flex;align-items:center;gap:5px}
.cdot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.s-new{
  margin:10px;padding:11px;border-radius:var(--rs);
  border:1px dashed var(--surface3);background:none;
  color:var(--text3);font-size:13px;font-family:var(--font-ar);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.s-new:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
 
/* EDITOR */
.editor{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.e-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:var(--text4);
}
.e-empty i{font-size:44px}
.e-empty p{font-size:13px;letter-spacing:.5px}
#eWrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.e-top{
  padding:10px 16px;border-bottom:1px solid var(--surface2);
  display:flex;align-items:center;gap:8px;
  background:var(--bg2);flex-shrink:0;
}
.cat-sel{
  padding:5px 10px;border-radius:20px;
  border:1px solid var(--surface3);background:var(--surface);
  color:var(--text2);font-size:12px;font-family:var(--font-ar);cursor:pointer;
  transition:border-color .15s;
}
.cat-sel:focus{outline:none;border-color:var(--accent)}
.wc{font-size:11px;color:var(--text3);margin-right:auto}
.e-title{
  width:100%;padding:16px 20px 8px;
  background:transparent;border:none;outline:none;
  font-size:22px;font-family:var(--font-serif);color:var(--text);
  flex-shrink:0;
}
.e-title::placeholder{color:var(--text4)}
.e-body{
  flex:1;width:100%;padding:8px 20px 16px;
  background:transparent;border:none;outline:none;resize:none;
  font-size:15px;font-family:var(--font-ar);color:var(--text);
  line-height:2;overflow-y:auto;
}
.e-body::placeholder{color:var(--text4)}
.e-body::-webkit-scrollbar{width:3px}
.e-body::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
.e-foot{
  padding:8px 16px;border-top:1px solid var(--surface2);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--bg2);flex-shrink:0;
}
.e-foot-info{font-size:11px;color:var(--text3)}
.del-btn{
  padding:5px 12px;border-radius:var(--rxs);
  border:1px solid rgba(179,58,46,0.3);background:none;
  color:var(--danger);font-size:12px;font-family:var(--font-ar);
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s;
}
.del-btn:hover{background:rgba(179,58,46,.12)}
 
/* CHANGE PIN MODAL */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;z-index:500;
  backdrop-filter:blur(4px);
}
.modal{
  background:var(--bg3);border:1px solid var(--surface3);
  border-radius:var(--r);padding:28px 28px;
  display:flex;flex-direction:column;gap:14px;
  min-width:290px;max-width:90vw;
  box-shadow:var(--shadow);
}
.modal h3{font-family:var(--font-serif);font-size:20px;color:var(--accent);text-align:center}
.modal input{
  padding:10px 14px;background:var(--surface);
  border:1px solid var(--surface3);border-radius:var(--rs);
  color:var(--text);font-size:15px;font-family:var(--font-ar);
  text-align:center;width:100%;transition:border-color .15s;
}
.modal input:focus{outline:none;border-color:rgba(200,168,75,0.4)}
.modal-btns{display:flex;gap:10px}
.modal-btns button{
  flex:1;padding:10px;border-radius:var(--rs);
  font-size:13px;font-family:var(--font-ar);cursor:pointer;
  border:1px solid var(--surface3);background:var(--surface);color:var(--text);
  transition:all .15s;
}
.modal-btns button.primary{
  background:var(--accent);color:#0c0b09;
  border-color:var(--accent);font-weight:600;
}
.modal-btns button:hover{opacity:.85}
.modal-err{font-size:12px;color:var(--danger);min-height:16px;text-align:center}
 
/* TOAST */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--surface2);color:var(--accent);
  padding:10px 20px;border-radius:var(--r);font-size:13px;
  font-family:var(--font-ar);z-index:600;
  border:1px solid rgba(200,168,75,0.3);
  box-shadow:var(--shadow);pointer-events:none;
  animation:fadeUp .3s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
 
/* MOBILE */
@media(max-width:640px){
  .sidebar{
    position:absolute;top:52px;bottom:0;right:0;left:0;
    z-index:50;width:100%;
    transform:translateX(110%);
  }
  .sidebar.open{transform:translateX(0)}
}
</style>
</head>
<body>
 
<!-- LOCK -->
<div id="lockScreen">
  <div class="lock-ornament"></div>
  <div class="lock-icon-wrap"><i class="ti ti-notebook"></i></div>
  <div class="lock-title">دفتري</div>
  <div class="lock-sub">ملاحظاتك الشخصية</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad" id="pinPad"></div>
  <div class="pin-err" id="pinErr"></div>
  <div class="lock-hint" onclick="openModal(true)">تغيير رقم السر</div>
  <div class="lock-ornament-bottom"></div>
</div>
 
<!-- LOADING -->
<div id="loadingScreen"><div class="loader"></div></div>
 
<!-- APP -->
<div id="app">
  <div class="topbar">
    <button class="iBtn" id="menuBtn" onclick="toggleSidebar()"><i class="ti ti-menu-2"></i></button>
    <div class="topbar-logo">دفتري</div>
    <div class="topbar-sync">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncTxt">جاري الاتصال...</span>
    </div>
    <button class="iBtn" onclick="openModal(false)" title="إعدادات"><i class="ti ti-settings"></i></button>
    <button class="iBtn" onclick="lockApp()" title="قفل"><i class="ti ti-lock"></i></button>
  </div>
  <div class="body">
    <div class="sidebar" id="sidebar">
      <div class="s-search">
        <input type="search" id="sInp" placeholder="🔍  بحث في ملاحظاتك..." oninput="renderList()"/>
      </div>
      <div class="s-cats" id="sCats"></div>
      <div class="s-list" id="sList"></div>
      <button class="s-new" onclick="newNote()">
        <i class="ti ti-plus"></i> ملاحظة جديدة
      </button>
    </div>
    <div class="editor">
      <div class="e-empty" id="eEmpty">
        <i class="ti ti-feather"></i>
        <p>اختر ملاحظة أو أنشئ واحدة جديدة</p>
      </div>
      <div id="eWrap" style="display:none">
        <div class="e-top">
          <button class="iBtn" id="pinBtn" onclick="togglePin()"><i class="ti ti-star"></i></button>
          <select class="cat-sel" id="catSel" onchange="setCat()">
            <option value="">— بدون تصنيف</option>
            <option value="دين">📿 دين</option>
            <option value="فقه">📚 فقه</option>
            <option value="حديث">📖 حديث</option>
            <option value="تفسير">🌿 تفسير</option>
            <option value="أفكار">💡 أفكار</option>
            <option value="مهام">✅ مهام</option>
            <option value="شخصي">🔒 شخصي</option>
            <option value="قناة">🎬 قناة</option>
          </select>
          <span class="wc" id="wc"></span>
        </div>
        <input class="e-title" id="eTitle" placeholder="العنوان..." oninput="autoSave()"/>
        <textarea class="e-body" id="eBody" placeholder="اكتب هنا...&#10;&#10;الملاحظات بتتزامن تلقائياً على كل أجهزتك ☁️" oninput="autoSave()"></textarea>
        <div class="e-foot">
          <span class="e-foot-info" id="eInfo"></span>
          <button class="del-btn" onclick="delNote()"><i class="ti ti-trash" style="font-size:13px"></i> حذف</button>
        </div>
      </div>
    </div>
  </div>
</div>
 
<!-- PIN MODAL -->
<div class="overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>تغيير رقم السر</h3>
    <div id="oldRow">
      <input type="password" id="oldInp" placeholder="الرقم الحالي" maxlength="10"/>
    </div>
    <input type="password" id="newInp" placeholder="الرقم الجديد" maxlength="10"/>
    <input type="password" id="confInp" placeholder="تأكيد الرقم الجديد" maxlength="10"/>
    <div class="modal-err" id="mErr"></div>
    <div class="modal-btns">
      <button onclick="closeModal()">إلغاء</button>
      <button class="primary" onclick="savePin()">حفظ</button>
    </div>
  </div>
</div>
 
<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
 
// ===== CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyChG_RLSduxWyJtyHqsTms_AKfTnuRuIxA",
  authDomain: "daftari-20fa7.firebaseapp.com",
  projectId: "daftari-20fa7",
  storageBucket: "daftari-20fa7.firebasestorage.app",
  messagingSenderId: "689147494048",
  appId: "1:689147494048:web:a1f0f576b2d5c0e69053c5"
};
 
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);
 
// ===== STATE =====
const PIN_KEY = 'daftari_pin_v2';
const DEFAULT_PIN = '1234';
let notes = [];
let currentId = null;
let activeCat = 'الكل';
let pinEntry = '';
let saveTimer = null;
let sidebarOpen = false;
let fromLock = false;
let userId = null;
let unsubscribe = null;
 
const CATS = {
  'دين':'#c9a84c','فقه':'#85B7EB','حديث':'#5DCAA5',
  'تفسير':'#8FC47A','أفكار':'#F0C97B','مهام':'#F0997B',
  'شخصي':'#AFA9EC','قناة':'#EC9FA9','':`#444`
};
 
// ===== PIN =====
const getPin = () => localStorage.getItem(PIN_KEY) || DEFAULT_PIN;
const setPin = p => localStorage.setItem(PIN_KEY, p);
 
function buildPad(){
  const pad = document.getElementById('pinPad');
  const keys = [
    {k:'1',s:''},{k:'2',s:'ABC'},{k:'3',s:'DEF'},
    {k:'4',s:'GHI'},{k:'5',s:'JKL'},{k:'6',s:'MNO'},
    {k:'7',s:'PQRS'},{k:'8',s:'TUV'},{k:'9',s:'WXYZ'},
    {k:'⌫',s:''},{k:'0',s:''},{k:'✓',s:''}
  ];
  keys.forEach(({k,s})=>{
    const b = document.createElement('button');
    b.className = 'pin-key' + (k==='✓'?' ok-key':k==='⌫'?' del-key':'');
    b.setAttribute('aria-label', k);
    if(k==='⌫') b.innerHTML='<i class="ti ti-backspace"></i>';
    else if(k==='✓') b.innerHTML='<i class="ti ti-check"></i>';
    else b.innerHTML = k + (s?`<span class="sub">${s}</span>`:'');
    b.onclick = ()=> handlePin(k);
    pad.appendChild(b);
  });
}
 
function handlePin(k){
  document.getElementById('pinErr').textContent='';
  if(k==='⌫') pinEntry=pinEntry.slice(0,-1);
  else if(k==='✓'){checkPin();return;}
  else if(pinEntry.length<10) pinEntry+=k;
  updateDots();
  if(pinEntry.length===4) setTimeout(checkPin,150);
}
 
function updateDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('d'+i);
    if(d) d.classList.toggle('filled',i<pinEntry.length);
  }
}
 
async function checkPin(){
  if(pinEntry===getPin()){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('loadingScreen').style.display='flex';
    await signInAnon();
  } else {
    document.getElementById('pinErr').textContent='رقم السر غلط، حاول تاني';
    pinEntry=''; updateDots();
    setTimeout(()=>document.getElementById('pinErr').textContent='',2000);
  }
}
 
async function signInAnon(){
  try {
    await signInAnonymously(auth);
  } catch(e){
    // fallback: show app with local only
    showApp();
    setSyncStatus('offline');
  }
}
 
onAuthStateChanged(auth, user=>{
  if(user){
    userId = user.uid;
    subscribeNotes();
  }
});
 
// ===== FIRESTORE =====
function subscribeNotes(){
  if(unsubscribe) unsubscribe();
  const col = collection(db, 'users', userId, 'notes');
  const q = query(col, orderBy('date','desc'));
  setSyncStatus('saving');
  unsubscribe = onSnapshot(q, snap=>{
    notes = snap.docs.map(d=>({id:d.id,...d.data()}));
    showApp();
    renderCats();
    renderList();
    setSyncStatus('online');
  }, err=>{
    setSyncStatus('offline');
    showApp();
  });
}
 
async function saveNote(n){
  if(!userId) return;
  setSyncStatus('saving');
  try {
    await setDoc(doc(db,'users',userId,'notes',String(n.id)), n);
  } catch(e){ setSyncStatus('offline'); }
}
 
async function removeNote(id){
  if(!userId) return;
  try {
    await deleteDoc(doc(db,'users',userId,'notes',String(id)));
  } catch(e){}
}
 
// ===== UI =====
function showApp(){
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('app').classList.add('show');
}
 
function setSyncStatus(s){
  const dot=document.getElementById('syncDot');
  const txt=document.getElementById('syncTxt');
  dot.className='sync-dot';
  if(s==='online'){dot.classList.add('online');txt.textContent='متزامن ☁️';}
  else if(s==='saving'){dot.classList.add('saving');txt.textContent='جاري الحفظ...';}
  else{txt.textContent='غير متصل';}
}
 
window.lockApp = function(){
  pinEntry=''; updateDots();
  document.getElementById('app').classList.remove('show');
  document.getElementById('lockScreen').style.display='flex';
  currentId=null;
  document.getElementById('eWrap').style.display='none';
  document.getElementById('eEmpty').style.display='flex';
  sidebarOpen=false;
  document.getElementById('sidebar').classList.remove('open');
};
 
window.toggleSidebar = function(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open',sidebarOpen);
};
 
// ===== RENDER =====
window.renderCats = function(){
  const existing = new Set(notes.map(n=>n.cat).filter(Boolean));
  const all = ['الكل','دين','فقه','حديث','تفسير','أفكار','مهام','شخصي','قناة'].filter(c=>c==='الكل'||existing.has(c));
  const row = document.getElementById('sCats');
  row.innerHTML='';
  all.forEach(c=>{
    const el=document.createElement('span');
    el.className='cat-chip'+(c===activeCat?' on':'');
    el.textContent=c;
    el.onclick=()=>{activeCat=c;renderCats();renderList();};
    row.appendChild(el);
  });
};
 
window.renderList = function(){
  const q=(document.getElementById('sInp').value||'').toLowerCase();
  let list=notes.filter(n=>{
    const mq=!q||n.title?.toLowerCase().includes(q)||n.body?.toLowerCase().includes(q);
    const mc=activeCat==='الكل'||n.cat===activeCat;
    return mq&&mc;
  });
  list.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||new Date(b.date)-new Date(a.date));
  const el=document.getElementById('sList');
  el.innerHTML='';
  if(!list.length){
    el.innerHTML='<p style="font-size:12px;color:var(--text4);padding:20px;text-align:center">لا توجد ملاحظات</p>';
    return;
  }
  list.forEach(n=>{
    const d=document.createElement('div');
    d.className='ncard'+(n.id===currentId?' on':'');
    const preview=(n.body||'').replace(/\n/g,' ').slice(0,50)||'—';
    const dateStr=new Date(n.date).toLocaleDateString('ar-EG',{month:'short',day:'numeric'});
    const dot=CATS[n.cat]||'#444';
    d.innerHTML=`
      <div class="ncard-title">
        ${n.pinned?'<i class="ti ti-star" style="color:var(--accent);font-size:11px;flex-shrink:0"></i>':''}
        <span>${esc(n.title)||'بدون عنوان'}</span>
      </div>
      <div class="ncard-preview">${esc(preview)}</div>
      <div class="ncard-meta">
        <span class="cdot" style="background:${dot}"></span>
        <span>${dateStr}</span>
        ${n.cat?`<span style="color:${dot};font-size:10px">${n.cat}</span>`:''}
      </div>`;
    d.onclick=()=>openNote(n.id);
    el.appendChild(d);
  });
};
 
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
 
// ===== EDITOR =====
function openNote(id){
  currentId=id;
  const n=notes.find(x=>x.id===id);
  if(!n) return;
  document.getElementById('eEmpty').style.display='none';
  const w=document.getElementById('eWrap');
  w.style.display='flex';w.style.flexDirection='column';
  w.style.flex='1';w.style.overflow='hidden';
  document.getElementById('eTitle').value=n.title||'';
  document.getElementById('eBody').value=n.body||'';
  document.getElementById('catSel').value=n.cat||'';
  updatePinBtn(n.pinned);
  updateInfo(n);
  updateWC(n.body||'');
  renderList();
  if(window.innerWidth<=640){sidebarOpen=false;document.getElementById('sidebar').classList.remove('open');}
}
 
window.autoSave = function(){
  if(!currentId) return;
  updateWC(document.getElementById('eBody').value);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const n=notes.find(x=>x.id===currentId);
    if(!n) return;
    n.title=document.getElementById('eTitle').value;
    n.body=document.getElementById('eBody').value;
    n.date=new Date().toISOString();
    updateInfo(n);
    saveNote(n);
    renderList();
  },800);
};
 
window.setCat = function(){
  if(!currentId) return;
  const n=notes.find(x=>x.id===currentId);
  if(!n) return;
  n.cat=document.getElementById('catSel').value;
  saveNote(n); renderList(); renderCats();
};
 
window.togglePin = function(){
  if(!currentId) return;
  const n=notes.find(x=>x.id===currentId);
  if(!n) return;
  n.pinned=!n.pinned;
  updatePinBtn(n.pinned);
  saveNote(n); renderList();
};
 
function updatePinBtn(p){
  const b=document.getElementById('pinBtn');
  b.classList.toggle('gold',p);
}
 
function updateInfo(n){
  const w=(n.body||'').trim().split(/\s+/).filter(Boolean).length;
  const d=new Date(n.date).toLocaleString('ar-EG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('eInfo').textContent=`${w} كلمة · ${d}`;
}
 
function updateWC(txt){
  const w=(txt||'').trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wc').textContent=w+' كلمة';
}
 
window.newNote = function(){
  const id='n'+Date.now();
  const n={id,title:'',body:'',cat:'',pinned:false,date:new Date().toISOString()};
  notes.unshift(n);
  saveNote(n);
  openNote(id);
  setTimeout(()=>document.getElementById('eTitle').focus(),80);
};
 
window.delNote = function(){
  if(!currentId) return;
  if(!confirm('هل تريد حذف هذه الملاحظة؟')) return;
  removeNote(currentId);
  notes=notes.filter(x=>x.id!==currentId);
  currentId=null;
  document.getElementById('eWrap').style.display='none';
  document.getElementById('eEmpty').style.display='flex';
  renderList(); renderCats();
};
 
// ===== PIN MODAL =====
window.openModal = function(fl){
  fromLock=fl;
  document.getElementById('oldRow').style.display=fl?'none':'block';
  document.getElementById('oldInp').value='';
  document.getElementById('newInp').value='';
  document.getElementById('confInp').value='';
  document.getElementById('mErr').textContent='';
  document.getElementById('modal').style.display='flex';
};
 
window.closeModal = function(){
  document.getElementById('modal').style.display='none';
};
 
window.savePin = function(){
  const old=document.getElementById('oldInp').value;
  const np=document.getElementById('newInp').value;
  const cf=document.getElementById('confInp').value;
  const err=document.getElementById('mErr');
  if(!fromLock&&old!==getPin()){err.textContent='الرقم الحالي غلط';return;}
  if(np.length<4){err.textContent='الرقم لازم 4 أرقام على الأقل';return;}
  if(np!==cf){err.textContent='الرقمان مش متطابقان';return;}
  setPin(np); closeModal();
  toast('تم تغيير رقم السر ✓');
};
 
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}
 
// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  const lock=document.getElementById('lockScreen');
  if(lock.style.display==='none'||lock.style.display==='') return;
  if(e.key>='0'&&e.key<='9') handlePin(e.key);
  else if(e.key==='Backspace') handlePin('⌫');
  else if(e.key==='Enter') handlePin('✓');
});
 
// ===== INIT =====
buildPad();
</script>
